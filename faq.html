═══════════════════════════════

Q：循環露是什麼？
A：循環露是 PRO◆Pharm 的 32 天循環保養精華液系統，共 8 個系列（G1–G8），每系列 4 支，每天使用 1 支，連續 4 天完成一個成分週期。設計理念是讓不同功效成分在最適合的時機輪流使用，達到最全面的保養效果。

Q：G1–G8 有什麼不同？
A：8 大系列各有主打方向——G1/G2 旗艦級主打促進吸收與深度煥活能量；G3 主打緊緻彈力；G4 主打亮采均色；G5 主打微生態調理穩定；G6 主打溫和舒緩；G7 主打深層保濕；G8 主打細緻毛孔均勻膚色。建議先從最在意的膚況出發選擇主力系列，再搭配 G1 鋪底。

Q：可以只買一個系列嗎？
A：當然可以！每個系列獨立販售，32 支為一完整套組。也可以加入 LINE 諮詢客製化組合，自由搭配 3–4 個系列，組成專屬您的循環方案。

Q：一定要按順序使用嗎？
A：同一系列的 4 支需依序使用（1→2→3→4），因為每支成分組合有所不同。不同系列之間的輪替順序，可依個人搭配方案調整。

Q：可以跟其他保養品一起用嗎？
A：可以！循環露建議在化妝水後、乳液或面霜前使用。擦完後等約 30 秒吸收，再進行後續步驟。

Q：首購優惠是什麼？

Q：如何訂購？
A：可透過官網 circulation-essence.app 的選購頁面直接下單；或加入 LINE @659prhya 進行客製化諮詢，由我們協助規劃 32 支組合並提供付款連結。

Q：配送方式與運費？
A：超商取貨（7-11/全家）NT$60；宅配（黑貓/新竹物流）NT$100。訂單金額滿 NT$2,500 免運費。

Q：多久會到貨？
A：付款確認後約 3–5 個工作天出貨，超商取貨一般 1–2 天可取件，宅配 2–3 天到府。

Q：可以退貨嗎？
A：一般商品未拆封享 7 天鑑賞期，可辦理退貨；拆封後恕不退貨。客製化組合依消費者保護法第 19 條但書，一經確認訂購不接受退換貨。若收到瑕疵品，請當日拍照並聯絡 LINE 客服，退貨運費由本公司負擔。

Q：敏感肌可以用嗎？
A：可以！G6 黑豆舒緩保養系列是專為敏感肌設計的，日本黑豆發酵萃取，配方溫和。建議敏感肌客戶先從 G6 開始，搭配 G5 微生態調理，循序漸進觀察膚況。若有特殊肌膚狀況，建議先諮詢皮膚科醫師。

Q：懷孕或哺乳期可以用嗎？
A：建議懷孕或哺乳期間使用任何保養品前，先諮詢婦產科或皮膚科醫師的意見。

let messages = [];
let isLoading = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
}

function sendQuick(text) {
  document.getElementById('inputBox').value = text;
  sendMsg();
}

function addMsg(role, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${role === 'ai' ? '✦' : '您'}</div>
    <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function addTyping() {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typingMsg';
  div.innerHTML = `
    <div class="msg-avatar">✦</div>
    <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
}

async function sendMsg() {
  if (isLoading) return;
  const input = document.getElementById('inputBox');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  addMsg('user', text);
  messages.push({ role: 'user', content: text });

  addTyping();

  try {
    const response = await fetch('https://circulation-ai.wonkochen.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await response.json();
    removeTyping();

    const reply = data.content?.[0]?.text || '抱歉，我暫時無法回答，請聯絡 LINE 客服 @659prhya';
    messages.push({ role: 'assistant', content: reply });
    addMsg('ai', reply);

  } catch (err) {
    removeTyping();
    addMsg('ai', '抱歉，網路連線異常，請稍後再試或聯絡 LINE 客服 @659prhya 😊');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('inputBox').focus();
}
</script>
